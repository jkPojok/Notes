version: '3.4'

services:
  notesapi:
    image: notesapi
    build:
      context: ./Notes/
      dockerfile: NotesApi/Dockerfile
    ports:
     - "5000:80"
  notesfrontend:
    image: notesfrontend
    build:
      context: ./notes-frontend/
      dockerfile: Dockerfile
    ports:
     - "5101:3000"
  notesidentity:
    image: notesidentity
    build:
      context: ./NotesIdentity/
      dockerfile: NotesIdentity/Dockerfile
    ports:
     - "5102:80"
  notesusers:
    image: notesusers
    build:
      context: ./NotesUsers/
      dockerfile: NotesUsersApi/Dockerfile
    ports:
     - "5103:80"
  notesdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=G647ggfhdgGf$!hf
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
  notesrabbit:
    image: rabbitmq:3.9.29-management
    ports:
      - "15672:15672" 
  nginxproxy:
    image: nginx:mainline
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf