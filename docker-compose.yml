version: '3.4'

services:
  notesapi:
    image: notesapi
    build:
      context: ./Notes/
      dockerfile: NotesApi/Dockerfile
    ports:
     - "5000:80"
  notesfrontend:
    image: notesfrontend
    build:
      context: ./notes-frontend/
      dockerfile: Dockerfile
    ports:
     - "5101:3000"
  notesdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=G647ggfhdgGf$!hf
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
